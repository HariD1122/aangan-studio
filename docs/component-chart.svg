<text x="950" y="46" text-anchor="middle" font-size="34" font-weight="700" fill="#14254a">Aangan Studio · From a Phone Call to a Closed Deal — Components Map</text>
<text x="950" y="76" text-anchor="middle" font-size="17" fill="#55627a">Follow the dashed arrows: a customer calls, the AI listens, the app saves it, and the team and CEO see the result. The small label in each box is the application doing that step.</text><rect x="24" y="92" width="1852" height="56" rx="10" fill="#14254a"/><text x="119" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Who</text><text x="352.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Trigger</text><text x="629.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Input</text><line x1="491" y1="100" x2="491" y2="140" stroke="#3a4a6b"/><text x="906.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Context</text><line x1="768" y1="100" x2="768" y2="140" stroke="#3a4a6b"/><text x="1183.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Processing</text><line x1="1045" y1="100" x2="1045" y2="140" stroke="#3a4a6b"/><text x="1460.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AI</text><line x1="1322" y1="100" x2="1322" y2="140" stroke="#3a4a6b"/><text x="1737.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Output</text><line x1="1599" y1="100" x2="1599" y2="140" stroke="#3a4a6b"/><rect x="24" y="148" width="1852" height="134" fill="#eaf1fd"/><rect x="24" y="150" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="213" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Customer</text><text x="119" y="236" text-anchor="middle" font-size="13.5" fill="#c3cde2">Phone call</text><rect x="24" y="282" width="1852" height="134" fill="#fff8e1"/><rect x="24" y="284" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="347" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Phone AI</text><text x="119" y="370" text-anchor="middle" font-size="13.5" fill="#c3cde2">App: VaaniVoice AI</text><rect x="24" y="416" width="1852" height="134" fill="#eaf6ec"/><rect x="24" y="418" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="481" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">The App</text><text x="119" y="504" text-anchor="middle" font-size="13.5" fill="#c3cde2">Apps: Vercel + Neon</text><rect x="24" y="550" width="1852" height="134" fill="#fde9f1"/><rect x="24" y="552" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="615" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AI Model</text><text x="119" y="638" text-anchor="middle" font-size="13.5" fill="#c3cde2">App: Google Gemini</text><rect x="24" y="684" width="1852" height="134" fill="#eef0fb"/><rect x="24" y="686" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="749" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">HubSpot</text><text x="119" y="772" text-anchor="middle" font-size="13.5" fill="#c3cde2">App: HubSpot CRM</text><rect x="24" y="818" width="1852" height="134" fill="#e6f6f8"/><rect x="24" y="820" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="883" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Telegram</text><text x="119" y="906" text-anchor="middle" font-size="13.5" fill="#c3cde2">App: Telegram bot</text><rect x="24" y="952" width="1852" height="134" fill="#fff3e6"/><rect x="24" y="954" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="1017" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Studio Team</text><text x="119" y="1040" text-anchor="middle" font-size="13.5" fill="#c3cde2">Admin + Designers</text><rect x="24" y="1086" width="1852" height="134" fill="#f1ecf8"/><rect x="24" y="1088" width="190" height="130" rx="6" fill="#14254a"/><text x="119" y="1151" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CEO / Board</text><text x="119" y="1174" text-anchor="middle" font-size="13.5" fill="#c3cde2">View only</text><line x1="491" y1="148" x2="491" y2="1220" stroke="#ffffff" stroke-width="2"/><line x1="768" y1="148" x2="768" y2="1220" stroke="#ffffff" stroke-width="2"/><line x1="1045" y1="148" x2="1045" y2="1220" stroke="#ffffff" stroke-width="2"/><line x1="1322" y1="148" x2="1322" y2="1220" stroke="#ffffff" stroke-width="2"/><line x1="1599" y1="148" x2="1599" y2="1220" stroke="#ffffff" stroke-width="2"/><path d="M472.5 215 L509.5 215" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M749.5 215 L1183.5 215 L1183.5 295" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1026.5 349 L1063.5 349" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1183.5 403 L1183.5 429" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1303.5 483 L1460.5 483 L1460.5 563" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1026.5 617 L1340.5 617" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1580.5 617 L1592.5 617 L1592.5 483 L1617.5 483" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1737.5 537 L1737.5 679 L1041.5 679 L1041.5 751 L1063.5 751" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1041.5 751 L1041.5 885 L1063.5 885" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1041.5 885 L1041.5 1019 L1063.5 1019" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1303.5 751 L1617.5 751" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1303.5 885 L1617.5 885" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1303.5 1019 L1617.5 1019" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1857.5 751 L1868 751 L1868 1153 L1857.5 1153" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="232.5" y="161" width="240" height="108" rx="10" fill="#ece9fb" stroke="#5b4fcf" stroke-width="2"/><text x="244.5" y="181" font-size="12.5" font-weight="700" fill="#5b4fcf">CUSTOMER'S PHONE</text><text x="352.5" y="210" text-anchor="middle" font-size="15" fill="#15233f">Customer phones the studio's</text><text x="352.5" y="229" text-anchor="middle" font-size="15" fill="#15233f">number</text><rect x="509.5" y="161" width="240" height="108" rx="10" fill="#e3effd" stroke="#3b82f6" stroke-width="2"/><text x="521.5" y="181" font-size="12.5" font-weight="700" fill="#3b82f6">VAANIVOICE AI</text><text x="629.5" y="205" text-anchor="middle" font-size="15" fill="#15233f">Tells the AI about the</text><text x="629.5" y="224" text-anchor="middle" font-size="15" fill="#15233f">project: place, size,</text><text x="629.5" y="243" text-anchor="middle" font-size="15" fill="#15233f">timeline, budget</text><rect x="786.5" y="295" width="240" height="108" rx="10" fill="#e4f6e8" stroke="#2e9e4f" stroke-width="2"/><text x="798.5" y="315" font-size="12.5" font-weight="700" fill="#2e9e4f">VAANIVOICE AI</text><text x="906.5" y="339" text-anchor="middle" font-size="15" fill="#15233f">AI's script: our services,</text><text x="906.5" y="358" text-anchor="middle" font-size="15" fill="#15233f">areas we serve, never quotes</text><text x="906.5" y="377" text-anchor="middle" font-size="15" fill="#15233f">prices</text><rect x="1063.5" y="295" width="240" height="108" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1075.5" y="315" font-size="12.5" font-weight="700" fill="#f08c00">VAANIVOICE AI</text><text x="1183.5" y="339" text-anchor="middle" font-size="15" fill="#15233f">AI receptionist answers,</text><text x="1183.5" y="358" text-anchor="middle" font-size="15" fill="#15233f">asks questions and records</text><text x="1183.5" y="377" text-anchor="middle" font-size="15" fill="#15233f">the call</text><rect x="1063.5" y="429" width="240" height="108" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1075.5" y="449" font-size="12.5" font-weight="700" fill="#f08c00">AANGAN APP ON VERCEL</text><text x="1183.5" y="473" text-anchor="middle" font-size="15" fill="#15233f">App receives the call</text><text x="1183.5" y="492" text-anchor="middle" font-size="15" fill="#15233f">report, ignores duplicates,</text><text x="1183.5" y="511" text-anchor="middle" font-size="15" fill="#15233f">saves it</text><rect x="786.5" y="563" width="240" height="108" rx="10" fill="#e4f6e8" stroke="#2e9e4f" stroke-width="2"/><text x="798.5" y="583" font-size="12.5" font-weight="700" fill="#2e9e4f">AANGAN APP</text><text x="906.5" y="602" text-anchor="middle" font-size="15" fill="#15233f">Owner's checklist: real</text><text x="906.5" y="621" text-anchor="middle" font-size="15" fill="#15233f">project? Pune / PCMC?</text><text x="906.5" y="640" text-anchor="middle" font-size="15" fill="#15233f">realistic timeline?</text><text x="906.5" y="659" text-anchor="middle" font-size="15" fill="#15233f">decision-maker?</text><rect x="1340.5" y="563" width="240" height="108" rx="10" fill="#fde1ee" stroke="#e0399b" stroke-width="2"/><text x="1352.5" y="583" font-size="12.5" font-weight="700" fill="#e0399b">GOOGLE GEMINI</text><text x="1460.5" y="612" text-anchor="middle" font-size="15" fill="#15233f">Writes 5 short notes + key</text><text x="1460.5" y="631" text-anchor="middle" font-size="15" fill="#15233f">details and judges the fit</text><rect x="1617.5" y="429" width="240" height="108" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1629.5" y="449" font-size="12.5" font-weight="700" fill="#e5483b">NEON DATABASE</text><text x="1737.5" y="478" text-anchor="middle" font-size="15" fill="#15233f">Lead created in the app with</text><text x="1737.5" y="497" text-anchor="middle" font-size="15" fill="#15233f">notes and full transcript</text><rect x="1063.5" y="697" width="240" height="108" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1075.5" y="717" font-size="12.5" font-weight="700" fill="#f08c00">HUBSPOT</text><text x="1183.5" y="741" text-anchor="middle" font-size="15" fill="#15233f">Client, designer and status</text><text x="1183.5" y="760" text-anchor="middle" font-size="15" fill="#15233f">are sent to HubSpot</text><text x="1183.5" y="779" text-anchor="middle" font-size="15" fill="#15233f">automatically (one way)</text><rect x="1617.5" y="697" width="240" height="108" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1629.5" y="717" font-size="12.5" font-weight="700" fill="#e5483b">HUBSPOT</text><text x="1737.5" y="741" text-anchor="middle" font-size="15" fill="#15233f">Admin types the quote, final</text><text x="1737.5" y="760" text-anchor="middle" font-size="15" fill="#15233f">budget and Won / Lost in</text><text x="1737.5" y="779" text-anchor="middle" font-size="15" fill="#15233f">HubSpot</text><rect x="1063.5" y="831" width="240" height="108" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1075.5" y="851" font-size="12.5" font-weight="700" fill="#f08c00">TELEGRAM</text><text x="1183.5" y="880" text-anchor="middle" font-size="15" fill="#15233f">App posts a 'New lead' alert</text><text x="1183.5" y="899" text-anchor="middle" font-size="15" fill="#15233f">(no phone numbers)</text><rect x="1617.5" y="831" width="240" height="108" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1629.5" y="851" font-size="12.5" font-weight="700" fill="#e5483b">TELEGRAM</text><text x="1737.5" y="880" text-anchor="middle" font-size="15" fill="#15233f">Team sees the alert on their</text><text x="1737.5" y="899" text-anchor="middle" font-size="15" fill="#15233f">phones</text><rect x="1063.5" y="965" width="240" height="108" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1075.5" y="985" font-size="12.5" font-weight="700" fill="#f08c00">AANGAN APP ON VERCEL</text><text x="1183.5" y="1009" text-anchor="middle" font-size="15" fill="#15233f">Admin reads the notes,</text><text x="1183.5" y="1028" text-anchor="middle" font-size="15" fill="#15233f">assigns a designer, asks for</text><text x="1183.5" y="1047" text-anchor="middle" font-size="15" fill="#15233f">meetings / tasks</text><rect x="1617.5" y="965" width="240" height="108" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1629.5" y="985" font-size="12.5" font-weight="700" fill="#e5483b">AANGAN APP ON VERCEL</text><text x="1737.5" y="1004" text-anchor="middle" font-size="15" fill="#15233f">Designer accepts or rejects</text><text x="1737.5" y="1023" text-anchor="middle" font-size="15" fill="#15233f">(with a reason). Accepted</text><text x="1737.5" y="1042" text-anchor="middle" font-size="15" fill="#15233f">meetings show on the</text><text x="1737.5" y="1061" text-anchor="middle" font-size="15" fill="#15233f">calendar</text><rect x="1617.5" y="1099" width="240" height="108" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1629.5" y="1119" font-size="12.5" font-weight="700" fill="#e5483b">AANGAN APP (SUMMARY PAGE)</text><text x="1737.5" y="1148" text-anchor="middle" font-size="15" fill="#15233f">CEO sees leads, revenue and</text><text x="1737.5" y="1167" text-anchor="middle" font-size="15" fill="#15233f">quotes, live from HubSpot</text><rect x="30" y="1236" width="26" height="18" rx="4" fill="#ece9fb" stroke="#5b4fcf" stroke-width="2"/><text x="64" y="1250" font-size="15" fill="#15233f">What starts it</text><rect x="218.39999999999998" y="1236" width="26" height="18" rx="4" fill="#e3effd" stroke="#3b82f6" stroke-width="2"/><text x="252.39999999999998" y="1250" font-size="15" fill="#15233f">Information given</text><rect x="432.59999999999997" y="1236" width="26" height="18" rx="4" fill="#e4f6e8" stroke="#2e9e4f" stroke-width="2"/><text x="466.59999999999997" y="1250" font-size="15" fill="#15233f">Rules and knowledge used</text><rect x="707" y="1236" width="26" height="18" rx="4" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="741" y="1250" font-size="15" fill="#15233f">What the system does</text><rect x="947" y="1236" width="26" height="18" rx="4" fill="#fde1ee" stroke="#e0399b" stroke-width="2"/><text x="981" y="1250" font-size="15" fill="#15233f">AI writes / decides</text><rect x="1178.4" y="1236" width="26" height="18" rx="4" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1212.4" y="1250" font-size="15" fill="#15233f">Result</text><rect x="24" y="1274" width="914" height="232" rx="12" fill="#f7f9fd" stroke="#3b82f6" stroke-width="2"/><text x="44" y="1306" font-size="20" font-weight="700" fill="#14254a">Applications used</text><text x="44" y="1338" font-size="15.5" font-weight="700" fill="#15233f">VaaniVoice AI</text><text x="239" y="1338" font-size="15.5" fill="#33415c">Answers the phone and records the call</text><text x="44" y="1363" font-size="15.5" font-weight="700" fill="#15233f">Google Gemini</text><text x="239" y="1363" font-size="15.5" fill="#33415c">Writes the short notes and judges the fit</text><text x="44" y="1388" font-size="15.5" font-weight="700" fill="#15233f">Neon</text><text x="239" y="1388" font-size="15.5" fill="#33415c">Database that stores every lead and call</text><text x="44" y="1413" font-size="15.5" font-weight="700" fill="#15233f">Vercel</text><text x="239" y="1413" font-size="15.5" fill="#33415c">Runs the website live on the internet</text><text x="44" y="1438" font-size="15.5" font-weight="700" fill="#15233f">GitHub</text><text x="239" y="1438" font-size="15.5" fill="#33415c">Keeps the program code safe (private)</text><text x="44" y="1463" font-size="15.5" font-weight="700" fill="#15233f">HubSpot</text><text x="239" y="1463" font-size="15.5" fill="#33415c">Sales CRM: quotes, final budget, Won / Lost</text><text x="44" y="1488" font-size="15.5" font-weight="700" fill="#15233f">Telegram</text><text x="239" y="1488" font-size="15.5" fill="#33415c">Sends 'new lead' alerts to the team group</text><rect x="962" y="1274" width="914" height="232" rx="12" fill="#f7f9fd" stroke="#2e9e4f" stroke-width="2"/><text x="982" y="1306" font-size="20" font-weight="700" fill="#14254a">Access to the Aangan Studio app</text><text x="982" y="1338" font-size="15.5" font-weight="700" fill="#15233f">Website</text><text x="1177" y="1338" font-size="15.5" fill="#33415c">aangan-studio-azure.vercel.app/login</text><text x="982" y="1363" font-size="15.5" font-weight="700" fill="#15233f">Admin login</text><text x="1177" y="1363" font-size="15.5" fill="#33415c">Given to the owner separately</text><text x="982" y="1388" font-size="15.5" font-weight="700" fill="#15233f">Designer login</text><text x="1177" y="1388" font-size="15.5" fill="#33415c">Given to the owner separately</text><text x="982" y="1413" font-size="15.5" font-weight="700" fill="#15233f">Admin can</text><text x="1177" y="1413" font-size="15.5" fill="#33415c">assign designers, request meetings, see everything</text><text x="982" y="1438" font-size="15.5" font-weight="700" fill="#15233f">Designer can</text><text x="1177" y="1438" font-size="15.5" fill="#33415c">see own clients, accept or reject meetings and tasks</text><text x="30" y="1536" font-size="14.5" fill="#55627a">Tasks and meetings given to designers stay inside the app and are never sent to HubSpot. You can test the whole flow with the app's "Run a sample call" button, without a phone number.</text></svg>