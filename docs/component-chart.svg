<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1188" viewBox="0 0 1900 1188" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#1c2b4a"/></marker></defs>
<rect width="1900" height="1188" fill="#ffffff"/>
<text x="950" y="46" text-anchor="middle" font-size="34" font-weight="700" fill="#14254a">Aangan Studio · From a Phone Call to a Closed Deal — Components Map</text>
<text x="950" y="76" text-anchor="middle" font-size="17" fill="#55627a">Follow the dashed arrows: a customer calls, the AI listens, the app saves it, and the team and CEO see the result.</text><rect x="24" y="92" width="1852" height="56" rx="10" fill="#14254a"/><text x="119" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Who</text><text x="352.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Trigger</text><text x="629.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Input</text><line x1="491" y1="100" x2="491" y2="140" stroke="#3a4a6b"/><text x="906.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Context</text><line x1="768" y1="100" x2="768" y2="140" stroke="#3a4a6b"/><text x="1183.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Processing</text><line x1="1045" y1="100" x2="1045" y2="140" stroke="#3a4a6b"/><text x="1460.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AI</text><line x1="1322" y1="100" x2="1322" y2="140" stroke="#3a4a6b"/><text x="1737.5" y="127" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Output</text><line x1="1599" y1="100" x2="1599" y2="140" stroke="#3a4a6b"/><rect x="24" y="148" width="1852" height="118" fill="#eaf1fd"/><rect x="24" y="150" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Customer</text><text x="119" y="227" text-anchor="middle" font-size="13.5" fill="#c3cde2">(Caller)</text><rect x="24" y="266" width="1852" height="118" fill="#fff8e1"/><rect x="24" y="268" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="323" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Phone AI</text><text x="119" y="345" text-anchor="middle" font-size="13.5" fill="#c3cde2">(VaaniVoice)</text><rect x="24" y="384" width="1852" height="118" fill="#eaf6ec"/><rect x="24" y="386" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="441" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">The App</text><text x="119" y="463" text-anchor="middle" font-size="13.5" fill="#c3cde2">(Website + database)</text><rect x="24" y="502" width="1852" height="118" fill="#fde9f1"/><rect x="24" y="504" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="559" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AI Model</text><text x="119" y="581" text-anchor="middle" font-size="13.5" fill="#c3cde2">(Gemini)</text><rect x="24" y="620" width="1852" height="118" fill="#eef0fb"/><rect x="24" y="622" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="677" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">HubSpot</text><text x="119" y="699" text-anchor="middle" font-size="13.5" fill="#c3cde2">(Sales CRM)</text><rect x="24" y="738" width="1852" height="118" fill="#e6f6f8"/><rect x="24" y="740" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="795" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Telegram</text><text x="119" y="817" text-anchor="middle" font-size="13.5" fill="#c3cde2">(Team group chat)</text><rect x="24" y="856" width="1852" height="118" fill="#fff3e6"/><rect x="24" y="858" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="913" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Studio Team</text><text x="119" y="935" text-anchor="middle" font-size="13.5" fill="#c3cde2">(Admin + Designers)</text><rect x="24" y="974" width="1852" height="118" fill="#f1ecf8"/><rect x="24" y="976" width="190" height="114" rx="6" fill="#14254a"/><text x="119" y="1031" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CEO / Board</text><text x="119" y="1053" text-anchor="middle" font-size="13.5" fill="#c3cde2">(View only)</text><line x1="491" y1="148" x2="491" y2="1092" stroke="#ffffff" stroke-width="2"/><line x1="768" y1="148" x2="768" y2="1092" stroke="#ffffff" stroke-width="2"/><line x1="1045" y1="148" x2="1045" y2="1092" stroke="#ffffff" stroke-width="2"/><line x1="1322" y1="148" x2="1322" y2="1092" stroke="#ffffff" stroke-width="2"/><line x1="1599" y1="148" x2="1599" y2="1092" stroke="#ffffff" stroke-width="2"/><path d="M470.5 207 L511.5 207" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M747.5 207 L1183.5 207 L1183.5 281" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1024.5 325 L1065.5 325" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1183.5 369 L1183.5 399" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1301.5 443 L1460.5 443 L1460.5 517" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1024.5 561 L1342.5 561" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1578.5 561 L1590.5 561 L1590.5 443 L1619.5 443" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1737.5 487 L1737.5 615 L1043.5 615 L1043.5 679 L1065.5 679" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1043.5 679 L1043.5 797 L1065.5 797" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1043.5 797 L1043.5 915 L1065.5 915" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1301.5 679 L1619.5 679" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1301.5 797 L1619.5 797" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1301.5 915 L1619.5 915" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1855.5 679 L1868 679 L1868 1033 L1855.5 1033" fill="none" stroke="#1c2b4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="234.5" y="163" width="236" height="88" rx="10" fill="#ece9fb" stroke="#5b4fcf" stroke-width="2"/><text x="352.5" y="202.5" text-anchor="middle" font-size="15" fill="#15233f">Customer phones the</text><text x="352.5" y="221.5" text-anchor="middle" font-size="15" fill="#15233f">studio's number</text><rect x="511.5" y="163" width="236" height="88" rx="10" fill="#e3effd" stroke="#3b82f6" stroke-width="2"/><text x="629.5" y="193" text-anchor="middle" font-size="15" fill="#15233f">Tells the AI about the</text><text x="629.5" y="212" text-anchor="middle" font-size="15" fill="#15233f">project: place, size,</text><text x="629.5" y="231" text-anchor="middle" font-size="15" fill="#15233f">timeline, budget</text><rect x="788.5" y="281" width="236" height="88" rx="10" fill="#e4f6e8" stroke="#2e9e4f" stroke-width="2"/><text x="906.5" y="311" text-anchor="middle" font-size="15" fill="#15233f">AI's script: our services,</text><text x="906.5" y="330" text-anchor="middle" font-size="15" fill="#15233f">areas we serve, never</text><text x="906.5" y="349" text-anchor="middle" font-size="15" fill="#15233f">quotes prices</text><rect x="1065.5" y="281" width="236" height="88" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1183.5" y="311" text-anchor="middle" font-size="15" fill="#15233f">AI receptionist answers,</text><text x="1183.5" y="330" text-anchor="middle" font-size="15" fill="#15233f">asks questions and records</text><text x="1183.5" y="349" text-anchor="middle" font-size="15" fill="#15233f">the call</text><rect x="1065.5" y="399" width="236" height="88" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1183.5" y="429" text-anchor="middle" font-size="15" fill="#15233f">App receives the call</text><text x="1183.5" y="448" text-anchor="middle" font-size="15" fill="#15233f">report, ignores duplicates,</text><text x="1183.5" y="467" text-anchor="middle" font-size="15" fill="#15233f">saves it</text><rect x="788.5" y="517" width="236" height="88" rx="10" fill="#e4f6e8" stroke="#2e9e4f" stroke-width="2"/><text x="906.5" y="537.5" text-anchor="middle" font-size="15" fill="#15233f">Owner's checklist: real</text><text x="906.5" y="556.5" text-anchor="middle" font-size="15" fill="#15233f">project? Pune / PCMC?</text><text x="906.5" y="575.5" text-anchor="middle" font-size="15" fill="#15233f">realistic timeline?</text><text x="906.5" y="594.5" text-anchor="middle" font-size="15" fill="#15233f">decision-maker?</text><rect x="1342.5" y="517" width="236" height="88" rx="10" fill="#fde1ee" stroke="#e0399b" stroke-width="2"/><text x="1460.5" y="547" text-anchor="middle" font-size="15" fill="#15233f">Gemini writes 5 short notes</text><text x="1460.5" y="566" text-anchor="middle" font-size="15" fill="#15233f">+ key details and judges</text><text x="1460.5" y="585" text-anchor="middle" font-size="15" fill="#15233f">the fit</text><rect x="1619.5" y="399" width="236" height="88" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1737.5" y="429" text-anchor="middle" font-size="15" fill="#15233f">Lead created in the app</text><text x="1737.5" y="448" text-anchor="middle" font-size="15" fill="#15233f">with notes and full</text><text x="1737.5" y="467" text-anchor="middle" font-size="15" fill="#15233f">transcript</text><rect x="1065.5" y="635" width="236" height="88" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1183.5" y="665" text-anchor="middle" font-size="15" fill="#15233f">Client, designer and status</text><text x="1183.5" y="684" text-anchor="middle" font-size="15" fill="#15233f">are sent to HubSpot</text><text x="1183.5" y="703" text-anchor="middle" font-size="15" fill="#15233f">automatically (one way)</text><rect x="1619.5" y="635" width="236" height="88" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1737.5" y="665" text-anchor="middle" font-size="15" fill="#15233f">Admin types the quote,</text><text x="1737.5" y="684" text-anchor="middle" font-size="15" fill="#15233f">final budget and Won / Lost</text><text x="1737.5" y="703" text-anchor="middle" font-size="15" fill="#15233f">in HubSpot</text><rect x="1065.5" y="753" width="236" height="88" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1183.5" y="792.5" text-anchor="middle" font-size="15" fill="#15233f">App posts a 'New lead'</text><text x="1183.5" y="811.5" text-anchor="middle" font-size="15" fill="#15233f">alert (no phone numbers)</text><rect x="1619.5" y="753" width="236" height="88" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1737.5" y="792.5" text-anchor="middle" font-size="15" fill="#15233f">Team sees the alert on</text><text x="1737.5" y="811.5" text-anchor="middle" font-size="15" fill="#15233f">their phones</text><rect x="1065.5" y="871" width="236" height="88" rx="10" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="1183.5" y="901" text-anchor="middle" font-size="15" fill="#15233f">Admin reads the notes,</text><text x="1183.5" y="920" text-anchor="middle" font-size="15" fill="#15233f">assigns a designer, asks</text><text x="1183.5" y="939" text-anchor="middle" font-size="15" fill="#15233f">for meetings / tasks</text><rect x="1619.5" y="871" width="236" height="88" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1737.5" y="891.5" text-anchor="middle" font-size="15" fill="#15233f">Designer accepts or rejects</text><text x="1737.5" y="910.5" text-anchor="middle" font-size="15" fill="#15233f">(with a reason). Accepted</text><text x="1737.5" y="929.5" text-anchor="middle" font-size="15" fill="#15233f">meetings show on the</text><text x="1737.5" y="948.5" text-anchor="middle" font-size="15" fill="#15233f">calendar</text><rect x="1619.5" y="989" width="236" height="88" rx="10" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1737.5" y="1019" text-anchor="middle" font-size="15" fill="#15233f">CEO sees leads, revenue and</text><text x="1737.5" y="1038" text-anchor="middle" font-size="15" fill="#15233f">quotes on the Summary page,</text><text x="1737.5" y="1057" text-anchor="middle" font-size="15" fill="#15233f">live from HubSpot</text><rect x="30" y="1108" width="26" height="18" rx="4" fill="#ece9fb" stroke="#5b4fcf" stroke-width="2"/><text x="64" y="1122" font-size="15" fill="#15233f">What starts it</text><rect x="218.39999999999998" y="1108" width="26" height="18" rx="4" fill="#e3effd" stroke="#3b82f6" stroke-width="2"/><text x="252.39999999999998" y="1122" font-size="15" fill="#15233f">Information given</text><rect x="432.59999999999997" y="1108" width="26" height="18" rx="4" fill="#e4f6e8" stroke="#2e9e4f" stroke-width="2"/><text x="466.59999999999997" y="1122" font-size="15" fill="#15233f">Rules and knowledge used</text><rect x="707" y="1108" width="26" height="18" rx="4" fill="#fff0d6" stroke="#f08c00" stroke-width="2"/><text x="741" y="1122" font-size="15" fill="#15233f">What the system does</text><rect x="947" y="1108" width="26" height="18" rx="4" fill="#fde1ee" stroke="#e0399b" stroke-width="2"/><text x="981" y="1122" font-size="15" fill="#15233f">AI writes / decides</text><rect x="1178.4" y="1108" width="26" height="18" rx="4" fill="#ffe6e3" stroke="#e5483b" stroke-width="2"/><text x="1212.4" y="1122" font-size="15" fill="#15233f">Result</text><text x="30" y="1156" font-size="15" fill="#55627a">Tasks and meetings given to designers stay inside the app and are never sent to HubSpot. Today you can also test the whole flow with the app's "Run a sample call" button, without a phone number.</text></svg>